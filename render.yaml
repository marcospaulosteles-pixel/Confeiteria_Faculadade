databases:
  - name: confeitaria-db
    plan: free
    databaseName: confeitaria
    user: confeitaria

services:
  - type: web
    name: confeitaria-faculdade
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: confeitaria-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: NOME_LOJA
        value: "Doces feitos com amor"
      - key: NOME_MARCA
        value: "Doce Encanto"
      - key: WHATSAPP_LOJA
        sync: false
      - key: ANTECEDENCIA_MINIMA_DIAS
        value: "3"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: LEGAL_NOME
        sync: false
      - key: LEGAL_DOCUMENTO
        sync: false
      - key: LEGAL_ENDERECO
        sync: false
      - key: LEGAL_CONTATO
        sync: false
      - key: LEGAL_EMAIL_PRIVACIDADE
        sync: false
