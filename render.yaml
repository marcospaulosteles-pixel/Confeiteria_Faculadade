databases:
  - name: confeitaria-db
    plan: free
    databaseName: confeitaria
    user: confeitaria

services:
  - type: web
    name: confeitaria-faculdade
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: confeitaria-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: NOME_LOJA
        value: "Doces feitos com amor"
      - key: ANTECEDENCIA_MINIMA_DIAS
        value: "3"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
