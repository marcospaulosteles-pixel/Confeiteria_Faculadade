{% extends "gestao/base.html" %}
{% block extra_head %}
<style>
/* ===== Layout da área de gestão (V5) ===== */
.g-hero{position:relative;overflow:hidden;min-height:230px;display:flex;align-items:center;background:linear-gradient(135deg,#8b1835,#b85269);border-bottom:1px solid var(--line)}
/* FOTO à direita: coloque o arquivo em gestao/static/gestao/img/confeitaria.jpg */
.g-hero:before{content:"";position:absolute;inset:0;background:url(/static/gestao/img/confeitaria.jpg) right center/cover no-repeat}
/* DEGRADÊ da esquerda (cor sólida) para a direita (foto aparecendo) */
.g-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fffaf6 0%,#fffaf6 36%,rgba(255,250,246,.86) 50%,rgba(255,250,246,.35) 72%,rgba(255,250,246,0) 100%)}
.g-hero-in{position:relative;z-index:1;width:100%;padding:44px 0}
.g-hero-text{max-width:600px;padding-left:clamp(10px,4vw,56px)}
.g-hero-text h1{font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;margin:10px 0 10px;letter-spacing:-.02em;color:var(--ink)}
.g-hero-text p{margin:0;color:var(--muted);font-size:1.05rem}
.g-wrap{padding:34px clamp(10px,4vw,56px) 64px}
.g-wrap>h2{margin:34px 0 12px;font-size:1.55rem}
.g-wrap>h2:first-child{margin-top:0}

.tag{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--sage);color:#3c5b36;font-size:.8rem;font-weight:700;letter-spacing:.02em}
.suave{color:var(--muted)}
.botao{display:inline-flex;align-items:center;justify-content:center;background:var(--wine);color:#fff;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:999px;margin:4px 6px 4px 0}
.botao:hover{background:var(--wine2)}
.cartao{background:#fff;border:1px solid var(--line);border-left:5px solid var(--wine);border-radius:18px;padding:20px 24px;margin:14px 0;box-shadow:0 8px 26px rgba(73,28,39,.06)}
.cartao h2{margin:0 0 10px;font-size:1.3rem}
.cartao ul{margin:10px 0;padding-left:22px}
.cartao label:first-child{margin-top:0}
.aviso{background:var(--sage);border:1px solid #d5e1cf;border-radius:16px;padding:16px 20px;margin:22px 0}
.alerta{background:#fff0f2;border:1px solid #f0cfd5;border-left:5px solid var(--wine);padding:13px 18px;border-radius:14px;margin:10px 0}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}
.numeros>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;color:var(--muted);font-size:.9rem}
.numeros b{display:block;font:700 1.55rem Georgia,serif;color:var(--wine);margin-top:4px}
.rolagem{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;margin:16px 0;box-shadow:0 8px 26px rgba(73,28,39,.05)}
.rolagem table{min-width:520px}
.g-wrap th{background:var(--rose);color:var(--wine);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;padding:12px 16px}
.g-wrap td{padding:13px 16px}
.g-wrap tr:last-child td{border-bottom:0}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acoes form{margin:0}
.sec{background:var(--sage)!important;color:var(--ink)!important}
.perigo{background:#fff!important;color:var(--wine)!important;border:1px solid var(--wine)!important}

.grade-admin{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;color:var(--muted);font-weight:600}
.kpi b{display:block;font:700 1.8rem Georgia,serif;color:var(--wine);margin:4px 0}
.kpi small{font-weight:400}
.atalhos a{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;text-decoration:none;font-weight:700;transition:.2s}
.atalhos a:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--wine)}
.agenda{border-left-width:5px}

@media(max-width:700px){
 .g-hero{min-height:0}
 .g-hero:after{background:linear-gradient(180deg,#fffaf6 0%,rgba(255,250,246,.93) 55%,rgba(255,250,246,.55) 100%)}
 .g-hero-in{padding:30px 0}
 .g-hero-text,.g-wrap{padding-left:6px;padding-right:6px}
}
</style>
{% endblock %}
{% block conteudo %}
<section class="g-hero"><div class="container g-hero-in"><div class="g-hero-text"><span class="tag">{% block g_tag %}Gestão{% endblock %}</span><h1>{% block g_titulo %}{% endblock %}</h1><p>{% block g_sub %}{% endblock %}</p></div></div></section>
<div class="container g-wrap">{% block g_conteudo %}{% endblock %}</div>
{% endblock %}
